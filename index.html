<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Mentor IDE</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font:15px system-ui}header{padding:16px 22px;background:#1e293b;display:flex;gap:9px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button{border:0;border-radius:6px;padding:9px 14px;background:#2563eb;color:white;cursor:pointer}main{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 68px)}textarea{box-sizing:border-box;width:100%;height:100%;min-height:600px;padding:20px;background:#020617;color:#dbeafe;border:0;outline:0;font:15px Consolas,monospace;line-height:1.55;resize:none}aside{padding:18px;background:#172033}pre{white-space:pre-wrap;background:#020617;padding:14px;border-radius:6px;min-height:140px}.ok{color:#86efac}.bad{color:#fca5a5}.muted{color:#94a3b8}@media(max-width:800px){main{grid-template-columns:1fr}aside{min-height:250px}}</style></head><body><header><h1>Python Mentor IDE</h1><button onclick="check()">Check code</button><button onclick="fix()">Auto-fix intent</button><button onclick="run()">Run</button><button onclick="clearAll()">Clear</button><span class="muted">Keywords: duplicate, factorial, Fibonacci, prime, palindrome, reverse, even, sum</span></header><main><textarea id="editor" spellcheck="false"># Try describing your intent with a keyword

</textarea><aside><h2>Mentor feedback</h2><pre id="out">Ready.</pre><p class="muted">This public demo uses Pyodide to run Python in your browser. Safe intent templates correct common beginner exercises; ambiguous code is left unchanged.</p></aside></main><script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script><script>const e=document.querySelector('#editor'),o=document.querySelector('#out');let pyodide;function dataExpr(c){let m=c.match(/\\b(?:items|values|numbers|data)\\s*=\\s*(\\[[^\\n]*\\]|\\([^\\n]*\\))/);return m?m[1]:'[1, 2, 3]'}function fixCode(c){let l=c.toLowerCase(),d=dataExpr(c);if(/duplicate|repeated item/.test(l))return ['# Auto-corrected intent: duplicate detection\\nitems = '+d+'\\nduplicates = []\\nfor item in items:\\n    if items.count(item) > 1 and item not in duplicates:\\n        duplicates.append(item)\\nprint(\'Duplicate items:\', duplicates)\\n','Intent recognized: duplicate detection.'];if(/factorial/.test(l))return ['number = 5\\nresult = 1\\nfor value in range(2, number + 1):\\n    result *= value\\nprint(\'Factorial:\', result)\\n','Intent recognized: factorial calculation.'];if(/fibonacci|fibonocci/.test(l))return ['count = 10\\na, b = 0, 1\\nsequence = []\\nfor _ in range(count):\\n    sequence.append(a)\\n    a, b = b, a + b\\nprint(\'Fibonacci:\', sequence)\\n','Intent recognized: Fibonacci sequence.'];if(/prime/.test(l))return ['number = 29\\nis_prime = number > 1 and all(number % divisor for divisor in range(2, int(number ** 0.5) + 1))\\nprint(\'Prime:\', is_prime)\\n','Intent recognized: prime test.'];if(/palindrome/.test(l))return ["text = 'level'\\nclean = ''.join(character.lower() for character in text if character.isalnum())\\nprint('Palindrome:', clean == clean[::-1])\\n",'Intent recognized: palindrome test.'];if(/reverse/.test(l))return ['items = '+d+"\\nprint('Reversed:', items[::-1])\\n",'Intent recognized: reverse sequence.'];if(/even|odd/.test(l))return ["number = 10\\nprint('Even' if number % 2 == 0 else 'Odd')\\n",'Intent recognized: even/odd classification.'];if(/sum|total|add numbers/.test(l))return ["items = "+d+"\\nprint('Total:', sum(items))\\n",'Intent recognized: sum/total calculation.'];let x=c.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/^(\\s*(?:if|for|while|def|class|elif|else|try|except|finally|with)\\b[^:\\n]*)$/gm,'$1:');return [x,x!==c?'Auto-fix applied: corrected common syntax punctuation.':'No safe automatic correction found.']}async function getPy(){if(!pyodide){o.textContent='Loading browser Python runtime...';pyodide=await loadPyodide()}return pyodide}async function check(){try{let p=await getPy();p.runPython(e.value);o.className='ok';o.textContent='OK: no syntax errors found.'}catch(x){o.className='bad';o.textContent=x.toString()}}async function fix(){let z=fixCode(e.value);e.value=z[0];try{let p=await getPy();p.runPython(z[0]);o.className='ok';o.textContent=z[1]+'\\n\\nCode is executable.'}catch(x){o.className='bad';o.textContent=z[1]+'\\n\\n'+x}}async function run(){let z=fixCode(e.value),c=z[0];if(c!==e.value)e.value=c;try{let p=await getPy();let source="import io, contextlib\\n_buffer=io.StringIO()\\nwith contextlib.redirect_stdout(_buffer):\\n    exec("+JSON.stringify(c)+")\\n_buffer.getvalue()";let result=p.runPython(source);o.className='ok';o.textContent=(c!==e.value?z[1]+'\\n\\n':'')+result}catch(x){o.className='bad';o.textContent=x.toString()}}function clearAll(){e.value='';o.textContent='Screen cleared.';e.focus()}</script></body></html>
