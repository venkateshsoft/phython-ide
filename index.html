<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Mentor IDE</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font: 15px system-ui;
    }

    header {
      padding: 16px 22px;
      background: #1e293b;
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 20px;
      margin: 0 auto 0 0;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 360px;
      min-height: calc(100vh - 68px);
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-height: 600px;
      padding: 20px;
      background: #020617;
      color: #dbeafe;
      border: 0;
      outline: 0;
      font: 15px Consolas, monospace;
      line-height: 1.55;
      resize: none;
    }

    aside {
      padding: 18px;
      background: #172033;
    }

    pre {
      white-space: pre-wrap;
      background: #020617;
      padding: 14px;
      border-radius: 6px;
      min-height: 140px;
    }

    .ok {
      color: #86efac;
    }

    .bad {
      color: #fca5a5;
    }

    .muted {
      color: #94a3b8;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Python Mentor IDE</h1>
    <button onclick="check()">Check code</button>
    <button onclick="fix()">Auto-fix intent</button>
    <button onclick="run()">Run</button>
    <button onclick="clearAll()">Clear</button>

    <span class="muted">
      Keywords: duplicate, factorial, Fibonacci, prime, palindrome, reverse, even, sum
    </span>
  </header>

  <main>
    <textarea id="editor" spellcheck="false"># Try describing your intent with a keyword
# Example: identify duplicate items
items = [1, 2, 2, 3, 4, 4]
duplicates = set(items)
print(duplicates)
</textarea>

    <aside>
      <h2>Mentor feedback</h2>
      <pre id="out">Ready.</pre>

      <p class="muted">
        This public demo uses Pyodide to run Python in your browser.
        Safe intent templates correct common beginner exercises.
      </p>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

  <script>
    const e = document.querySelector("#editor");
    const o = document.querySelector("#out");

    let pyodide;

    function code(...lines) {
      return lines.join("\n") + "\n";
    }

    function dataExpr(c) {
      const match = c.match(
        /\b(?:items|values|numbers|data)\s*=\s*(\[[^\n]*\]|\([^\n]*\))/
      );

      return match ? match[1] : "[1, 2, 3]";
    }

    function fixCode(c) {
      const lower = c.toLowerCase();
      const data = dataExpr(c);

      if (/duplicate|repeated item/.test(lower)) {
        return [
          code(
            "# Auto-corrected intent: duplicate detection",
            `items = ${data}`,
            "duplicates = []",
            "for item in items:",
            "    if items.count(item) > 1 and item not in duplicates:",
            "        duplicates.append(item)",
            "print('Duplicate items:', duplicates)"
          ),
          "Intent recognized: duplicate detection."
        ];
      }

      if (/factorial/.test(lower)) {
        return [
          code(
            "number = 5",
            "result = 1",
            "for value in range(2, number + 1):",
            "    result *= value",
            "print('Factorial:', result)"
          ),
          "Intent recognized: factorial calculation."
        ];
      }

      if (/fibonacci|fibonocci/.test(lower)) {
        return [
          code(
            "count = 10",
            "a, b = 0, 1",
            "sequence = []",
            "for _ in range(count):",
            "    sequence.append(a)",
            "    a, b = b, a + b",
            "print('Fibonacci:', sequence)"
          ),
          "Intent recognized: Fibonacci sequence."
        ];
      }

      if (/prime/.test(lower)) {
        return [
          code(
            "number = 29",
            "is_prime = number > 1 and all(",
            "    number % divisor",
            "    for divisor in range(2, int(number ** 0.5) + 1)",
            ")",
            "print('Prime:', is_prime)"
          ),
          "Intent recognized: prime test."
        ];
      }

      if (/palindrome/.test(lower)) {
        return [
          code(
            "text = 'level'",
            "clean = ''.join(",
            "    character.lower()",
            "    for character in text",
            "    if character.isalnum()",
            ")",
            "print('Palindrome:', clean == clean[::-1])"
          ),
          "Intent recognized: palindrome test."
        ];
      }

      if (/reverse/.test(lower)) {
        return [
          code(
            `items = ${data}`,
            "print('Reversed:', items[::-1])"
          ),
          "Intent recognized: reverse sequence."
        ];
      }

      if (/even|odd/.test(lower)) {
        return [
          code(
            "number = 10",
            "print('Even' if number % 2 == 0 else 'Odd')"
          ),
          "Intent recognized: even/odd classification."
        ];
      }

      if (/sum|total|add numbers/.test(lower)) {
        return [
          code(
            `items = ${data}`,
            "print('Total:', sum(items))"
          ),
          "Intent recognized: sum/total calculation."
        ];
      }

      const corrected = c
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(
          /^(\s*(?:if|for|while|def|class|elif|else|try|except|finally|with)\b[^:\n]*)$/gm,
          "$1:"
        );

      return [
        corrected,
        corrected !== c
          ? "Auto-fix applied: corrected common syntax punctuation."
          : "No safe automatic correction found."
      ];
    }

    async function getPy() {
      if (!pyodide) {
        o.textContent = "Loading browser Python runtime...";
        pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
        });
      }

      return pyodide;
    }

    async function check() {
      try {
        const p = await getPy();
        p.runPython(e.value);

        o.className = "ok";
        o.textContent = "OK: no syntax errors found.";
      } catch (error) {
        o.className = "bad";
        o.textContent = error.toString();
      }
    }

    async function fix() {
      const result = fixCode(e.value);
      e.value = result[0];

      try {
        const p = await getPy();
        p.runPython(result[0]);

        o.className = "ok";
        o.textContent = result[1] + "\n\nCode is executable.";
      } catch (error) {
        o.className = "bad";
        o.textContent = result[1] + "\n\n" + error.toString();
      }
    }

    async function run() {
      const result = fixCode(e.value);
      const correctedCode = result[0];
      const changed = correctedCode !== e.value;

      if (changed) {
        e.value = correctedCode;
      }

      try {
        const p = await getPy();

        const source = [
          "import io, contextlib",
          "_buffer = io.StringIO()",
          "with contextlib.redirect_stdout(_buffer):",
          "    exec(" + JSON.stringify(correctedCode) + ")",
          "_buffer.getvalue()"
        ].join("\n");

        const output = p.runPython(source);

        o.className = "ok";
        o.textContent =
          (changed ? result[1] + "\n\n" : "") + output;
      } catch (error) {
        o.className = "bad";
        o.textContent = error.toString();
      }
    }

    function clearAll() {
      e.value = "";
      o.className = "";
      o.textContent = "Screen cleared.";
      e.focus();
    }
  </script>
</body>
</html>
